[package]
name = "spike-rust"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hmac = "0.13.0"
sha2 = "0.11.1"
subtle = "2.6.1"
futures-util = "0.3.34"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
