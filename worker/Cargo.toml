[package]
name = "surfaceant-worker"
description = "SurfaceAnt relay: Cloudflare Worker + one Durable Object per channel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.9.0"
surfaceant-proto = { path = "../crates/surfaceant-proto" }
hmac = "0.13.0"
sha2 = "0.11.1"
subtle = "2.6.1"
futures-util = "0.3.34"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
