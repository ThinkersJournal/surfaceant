[package]
name = "surfaceant-client"
description = "SurfaceAnt client (skeleton: decodes relay frames; no connection logic yet)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
surfaceant-proto = { path = "../surfaceant-proto" }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util", "sync"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
hmac = "0.13.0"
sha2 = "0.11.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
serde_json = "1.0.154"
rcgen = "0.14.10"
tokio-rustls = "0.26.6"
